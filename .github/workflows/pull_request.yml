name: Laravel Test, Code Coverage and Code Statistics

on:
  pull_request:

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, dom, curl, libxml, zip, pcov
          coverage: pcov
          ini-values: pcov.directory=app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install NPM dependencies & build assets
        run: |
          npm install
          npm run build

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate key
        run: php artisan key:generate

      - name: Create Database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Execute tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test --coverage-cobertura=coverage.xml

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          hide_complexity: true
          output: both

      - name: Generate Code Statistics (scc)
        shell: bash
        run: |
          sudo chown $USER:$USER code-coverage-results.md

          echo "" >> code-coverage-results.md
          echo "---" >> code-coverage-results.md
          echo "## 📊 Code Statistics" >> code-coverage-results.md

          curl -sSL https://github.com/boyter/scc/releases/download/v3.7.0/scc_Linux_x86_64.tar.gz| tar -xz

          echo '```' >> code-coverage-results.md
          ./scc --exclude-dir vendor,node_modules,storage,public/build --sort code >> code-coverage-results.md
          echo '
          ```' >> code-coverage-results.md

      - name: Add Coverage & Stats PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md

      - name: Add Summary to Action
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
